{% extends "base.html" %}
{% block title %}注册{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>注册</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" action="{{ url_for('register') }}" class="form">
    <label for="username">用户名（3–20 个字符）</label>
    <input id="username" name="username" type="text" value="{{ username }}" required>

    <label for="password">密码（至少 6 位）</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>

    <label for="confirm">再输一次密码</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>

    <div class="form-actions">
      <button class="btn" type="submit">注册</button>
      <a class="btn ghost" href="{{ url_for('login') }}">已有账号？登录</a>
    </div>
  </form>
</section>
{% endblock %}
